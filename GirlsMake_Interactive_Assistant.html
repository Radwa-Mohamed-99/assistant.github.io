<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعد استكشاف الأخطاء | Girls Make</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&family=Baloo+Bhaijaan+2:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{ --main:#e63566; --sec:#13b6ab; --bg:#fffafc; --txt:#34204f; --yellow:#ffc233; }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Tajawal',sans-serif;}
  body{ background-color:var(--bg); background-image:radial-gradient(circle at 10% 15%,rgba(230,53,102,.08) 0 3px,transparent 4px),radial-gradient(circle at 90% 10%,rgba(19,182,171,.08) 0 4px,transparent 5px),radial-gradient(circle at 82% 88%,rgba(255,194,51,.10) 0 3px,transparent 4px),linear-gradient(135deg,rgba(122,74,216,.025) 25%,transparent 25%),linear-gradient(315deg,rgba(230,53,102,.025) 25%,transparent 25%); background-size:140px 140px,180px 180px,160px 160px,46px 46px,46px 46px; color:var(--txt); line-height:1.7; padding:20px; min-height:100vh; }
  .wrap{ max-width:900px; margin:0 auto; }
  .hero{ background:linear-gradient(120deg,var(--main),#7a4ad8); color:#fff; padding:20px 30px; border-radius:20px; display:flex; gap:20px; align-items:center; box-shadow:0 10px 20px rgba(0,0,0,0.1); margin-bottom:20px; position:relative; overflow:hidden;}
  .logo-box{ background:#fff; border-radius:16px; padding:9px 14px; flex:0 0 auto; z-index:2; box-shadow:0 6px 14px rgba(0,0,0,0.18); display:flex; align-items:center; }
  .logo-box .gm-logo{ height:56px; width:auto; display:block; }
  .hero-txt { z-index:2; }
  .hero h1{ font-family:'Baloo Bhaijaan 2'; font-size:1.8rem; margin-bottom:5px; }
  .tabs{ display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
  .tab{ flex:1 1 200px; padding:15px; border:none; background:#fff; color:var(--main); font-size:1.1rem; font-weight:bold; border-radius:15px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.05); transition:0.3s; font-family:'Baloo Bhaijaan 2'; }
  .tab.active{ background:var(--main); color:#fff; }
  .panel{ display:none; background:rgba(255,255,255,.96); padding:25px; border-radius:20px; box-shadow:0 8px 26px rgba(68,39,90,.08); backdrop-filter:blur(3px); }
  .panel.show{ display:block; animation:fade 0.4s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
  .step-card{ border:2px solid #ffe7ee; padding:20px; border-radius:15px; margin-bottom:15px; background:linear-gradient(180deg,#fffafc,#fff4f7); }
  .step-num{ background:var(--main); color:#fff; padding:5px 15px; border-radius:20px; font-weight:bold; display:inline-flex; align-items:center; gap:8px; margin-bottom:12px; }
  .step-card h3{ font-family:'Baloo Bhaijaan 2'; font-size:1.3rem; margin-bottom:10px; color:var(--main); }
  .btn-row{ display:flex; gap:10px; margin-top:15px; flex-wrap:wrap; }
  .btn{ flex:1 1 150px; padding:12px; border:none; border-radius:12px; font-weight:bold; cursor:pointer; transition:0.2s; font-size:1rem; font-family:'Tajawal'; }
  .btn:hover{ transform:translateY(-2px); }
  .btn-yes{ background:var(--sec); color:#fff; }
  .btn-no{ background:#fff; color:var(--main); border:2px solid var(--main); }
  .chat-box{ height:550px; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:15px; background:#fffafc; border:2px solid #ffe7ee; border-radius:15px; }
  .chat-box::-webkit-scrollbar{ width:6px; }
  .chat-box::-webkit-scrollbar-thumb{ background:#ffe7ee; border-radius:10px; }
  .msg{ display:flex; gap:10px; max-width:90%; animation:fade 0.3s ease; }
  .msg.bot{ align-self:flex-start; }
  .msg.user{ align-self:flex-end; flex-direction:row-reverse; }
  .avatar{ width:46px; height:46px; background:#fff; border-radius:14px; display:flex; justify-content:center; align-items:center; font-size:26px; box-shadow:0 3px 8px rgba(0,0,0,0.1); border:1px solid #eee; flex:0 0 auto; }
  .bubble{ padding:15px 18px; border-radius:18px; background:#fff; border:1px solid #eee; box-shadow:0 3px 10px rgba(0,0,0,0.03); line-height:1.6; font-size:1rem; }
  .msg.user .bubble{ background:linear-gradient(120deg,var(--main),#e63566); color:#fff; border:none; }
  .bubble b{ color:var(--main); }
  .msg.user .bubble b{ color:#fff; }
  .panda-say{ display:block; font-family:'Baloo Bhaijaan 2'; color:var(--sec); font-size:0.95rem; margin-bottom:6px; }
  .typing .bubble{ display:flex; gap:5px; align-items:center; padding:15px; }
  .typing span{ width:6px; height:6px; background:var(--main); border-radius:50%; animation:blink 1s infinite; opacity:0.4; }
  .typing span:nth-child(2){ animation-delay:0.2s; }
  .typing span:nth-child(3){ animation-delay:0.4s; }
  @keyframes blink{ 50%{opacity:1; transform:scale(1.2);} }
  .choices{ display:flex; flex-wrap:wrap; gap:8px; margin-top:5px; animation:fade 0.3s ease; }
  .chip{ padding:10px 16px; border:2px solid var(--main); border-radius:15px; background:#fff; color:var(--main); font-weight:bold; cursor:pointer; transition:0.2s; font-size:0.95rem; font-family:'Tajawal'; }
  .chip:hover{ background:var(--main); color:#fff; transform:translateY(-2px); }
  .chip.teal{ border-color:var(--sec); color:var(--sec); }
  .chip.teal:hover{ background:var(--sec); color:#fff; }
  .pin-card{ background:#fff; border:2px dashed var(--sec); padding:15px; border-radius:15px; width:320px; max-width:100%; }
  .pin-card h4{ color:#0e8f86; margin-bottom:10px; font-family:'Baloo Bhaijaan 2'; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:0.85rem; font-weight:bold; margin-bottom:5px; }
  .field select, .field input{ width:100%; padding:8px; border:2px solid #eee; border-radius:8px; font-family:'Tajawal'; font-weight:bold; outline:none; }
  .field select:focus, .field input:focus{ border-color:var(--sec); }
  .pin-card button{ width:100%; padding:10px; background:var(--sec); color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-family:'Tajawal'; }
  .celebration-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(255,250,252,.18);animation:celebrationFade 3.4s ease forwards;}
  .celebration-card{background:rgba(255,255,255,.96);border:3px solid #ffe0eb;border-radius:26px;padding:24px 34px;text-align:center;box-shadow:0 18px 50px rgba(122,74,216,.22);animation:celebrationPop .7s cubic-bezier(.2,.9,.25,1.25) both;}
  .celebration-card .big{font-size:54px;line-height:1;display:block;animation:celebrationBounce .8s ease .25s both;}
  .celebration-card strong{display:block;color:var(--main);font-family:'Baloo Bhaijaan 2';font-size:1.65rem;margin-top:10px;}
  .confetti-piece{position:absolute;top:-12vh;width:11px;height:18px;border-radius:3px;opacity:.95;animation:confettiFall var(--fall-time) linear var(--delay) forwards;transform:rotate(var(--rotate));}
  @keyframes confettiFall{0%{transform:translate3d(0,-12vh,0) rotate(0deg);}100%{transform:translate3d(var(--drift),112vh,0) rotate(760deg);}}
  @keyframes celebrationPop{0%{opacity:0;transform:scale(.55) translateY(20px);}100%{opacity:1;transform:scale(1) translateY(0);}}
  @keyframes celebrationBounce{0%{transform:scale(.4) rotate(-15deg);}60%{transform:scale(1.18) rotate(8deg);}100%{transform:scale(1) rotate(0);}}
  @keyframes celebrationFade{0%,78%{opacity:1;}100%{opacity:0;}}
  @media (prefers-reduced-motion:reduce){.celebration-layer,.celebration-card,.celebration-card .big,.confetti-piece{animation:none!important}.celebration-layer{background:transparent}.confetti-piece{display:none}}
</style>
</head>

<script>
  const APP_DATA = {"general":{"mascotName":"باندا","welcomeTitle":"مساعد استكشاف الأخطاء وحل المشاكل","welcomeDesc":"اكتشفي الأخطاء وصلّحيها بنفسك خطوة بخطوة مع المساعد الآلي لـ Girls Make ✨","chatWelcome":"يا أهلاً بيكي! أنا الإنستراكتور الآلي \"باندا\". هنحل المشكلة خطوة بخطوة كأني جنبك في اللاب.<br><br>في الأول.. شغّالة على أنهي شيلد (اللوحة اللي فوق الأردوينو)؟"},"checklist":[{"icon":"🔌","title":"راجعتي التوصيلات؟","detail":"هل كل سلك متوصل على نفس رقم البين المكتوب في الكود؟ وتأكدي إن الأسلاك ثابتة ومفيش سلك مفكوك.\nوتأكدي إن سلك الموجب (V / VCC) في مكانه، وسلك السالب (G / GND) في مكانه، ومفيش سلك موجب لامس سالب.","tip":"لو السلك بيتحرك بسهولة، يبقى مش ثابت كويس."},{"icon":"📖","title":"رجعتي لورقة المكونات المرجعية؟","detail":"عشان تتأكدي إنك بتستخدمي البلوك الصح في البرمجة، وطريقة التوصيل السليمة للمكون.","tip":"كل مكون ليه بلوك خاص بيه وبين مناسب ليه."},{"icon":"🔋","title":"راجعتي مصدر الكهرباء؟","detail":"هل الكهرباء متوصلة بالشاحن؟ افصلي كابل الـ USB وتأكدي إن الأردوينو بياخد طاقة كافية من الشاحن أو البطارية. وبصّي على لمبات الأردوينو والشيلد لازم يكونوا منوّرين.","tip":"المواتير والسيرفو لازم أدابتر أو بطارية خارجية."},{"icon":"🧩","title":"راجعتي الكود؟","detail":"تأكدي من منطق الكود، وهل استخدمتي بلوك forever للأوامر اللي المفروض تفضل شغّالة؟","tip":"لو نسيتي الـ forever، الكود هيشتغل مرة واحدة ويقف."},{"icon":"⬆️","title":"جربتي ترفعي الكود تاني؟","detail":"تأكدي إن الشيلد متركّبة صح ومفيش أرجل ملويّة. واختاري لوحة Arduino ورقم المنفذ (port) الصح، وبعدين ارفعي الكود من جديد.","tip":"الخطأ ممكن يكون في الكود نفسه، أو في رفع الكود للوحة."},{"icon":"🔁","title":"جربتي تعيدي تشغيل الأردوينو؟","detail":"افصلي الأردوينو من مصدر الطاقة شوية، وبعدين وصّليه تاني، أو اضغطي زرار إعادة الضبط (RESET) الموجود على اللوحة.","tip":"بيحل مشاكل التعليق المفاجئ."},{"icon":"🧪","title":"اتأكدتي إن المكون نفسه شغّال؟","detail":"اختبري المكون لوحده في كود بسيط بيشغّله هو بس. ولو الأردوينو مش بيرفع خالص، افصلي كل الأسلاك وارفعي كود إضاءة وإطفاء بسيط.","tip":"عزل المكون بيعرّفك ا led","name":"لمبة LED / صفّارة Buzzer","icon":"💡","signal":"digital","issues":[{"q":"مش بتنوّر أو الصفّارة مش بتزمّر خالص","steps":[{"type":"text","n":"توصيل الكهرباء (الموجب والسالب)","t":"المكون ليه 3 أسلاك. سلك السالب (الأسود/البني) لازم يروح لحرف G (السالب)، وسلك الموجب (الأحمر) لازم يروح لحرف V (الموجب). تأكدي منهم الأول."},{"type":"text","n":"البلوك الصح","t":"للّمبة استخدمي بلوك set digital pin … output as high عشان تنوّريها (و low عشان تطفّيها). وللصفّارة استخدمي بلوك play pin … with note واختاري نغمة."},{"type":"pinCheck","role":"","msg":"تمام، دلوقتي نتأكد من بين الإشارة (السلك اللي بيوصّل الأمر):"},{"type":"text","n":"منطق الكود","t":"لو عايزاها تنوّر وتطفي، لازم يكون في بلوك wait 1 seconds بين أمر الـ high وأمر الـ low، وإلا هتحصل بسرعة مش هتشوفيها."}]},{"q":"عايزة أتحكم في شدة الإضاءة","steps":[{"type":"text","n":"بين الإضاءة المتغيرة (PWM)","t":"التحكم في الشدة بيشتغل بس على بينات معيّنة (عليها علامة ~): 3 · 5 · 6 · 9 · 10 · 11. وصّلي اللمبة على واحدة منهم."},{"type":"text","n":"البلوك الصح","t":"استخدمي بلوك Set PWM بدل set digital pin، والقيمة من 0 (مطفية) لـ 255 (أعلى إضاءة). جرّبي 120 الأول."}]}]},{"id":"button","name":"زرار (Push Button)","icon":"🔘","signal":"digital","issues":[{"q":"الزرار مش بيقرا الضغط","steps":[{"type":"text","n":"توصيل الكهرباء (الموجب والسالب)","t":"اتأكدي إن سلك الموجب (V) وسلك السالب (G) بتوع الزرار في مكانهم الصح وثابتين."},{"type":"text","n":"البلوك الصح","t":"استخدمي بلوك read digital pin من قائمة Pin، ده اللي بيقرا حالة الزرار."},{"type":"pinCheck","role":"","msg":"نتأكد من بين الإشارة بتاع الزرار:"},{"type":"text","n":"اقري على الشاشة","t":"القراءة المفروض تطلع 1 وقت الضغط و 0 وقت السيبان. اطبعيها على شاشة الـ LCD وجرّبي تضغطي وتسيبي وشوفي الرقم بيتغير."}]}]},{"id":"pot","name":"مقاومة متغيرة (Potentiometer)","icon":"🎛️","signal":"analog","issues":[{"q":"القيمة مش بتتغير لما بلف","steps":[{"type":"text","n":"نوع البين","t":"المقاومة المتغيرة لازم تتوصل على بين أنالوج (A0 لحد A5)، مش ديجيتال. اتأكدي من ده الأول."},{"ty     "ماشيين صح، استمري 🚀", "بقيتي محترفة بجد 🛠️", "ولا يهمّك، هنوصل للحل 😄",

  function showCongratulations(message){
    const old = document.querySelector('.celebration-layer');
    if(old) old.remove();
    const layer = document.createElement('div');
    layer.className = 'celebration-layer';
    layer.innerHTML = '<div class="celebration-card"><span class="big">🎉</span><strong>' + (message || 'برافو عليكي!') + '</strong><span>✨ عاش يا بطلة ✨</span></div>';
    const colors = ['#e63566','#13b6ab','#ffc233','#7a4ad8','#ff7aa2','#4dd0e1'];
    for(let i=0;i<90;i++){
      const piece = document.createElement('i');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random()*100 + 'vw';
      piece.style.background = colors[i % colors.length];
      piece.style.setProperty('--fall-time', (2.1 + Math.random()*1.7) + 's');
      piece.style.setProperty('--delay', (Math.random()*.45) + 's');
      piece.style.setProperty('--drift', ((Math.random()-.5)*260) + 'px');
      piece.style.setProperty('--rotate', (Math.random()*180) + 'deg');
      piece.style.width = (7 + Math.random()*8) + 'px';
      piece.style.height = (10 + Math.random()*13) + 'px';
      layer.appendChild(piece);
    }
    document.body.appendChild(layer);
    setTimeout(() => layer.remove(), 3600);
  }

  function switchTab(t){
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
    event.target.classList.add('active');
    document.getElementById(t).classList.add('show');
    if(t === 'chat' && document.getElementById('chatWindow').innerHTML === ''){ startChat(); }
  }

  // ===== خطوات المراجعة الأساسية =====
  let cStep = 0;
  let flowSolved = false;

  function markFlowSolved(){
    flowSolved = true;
    renderFlow();
  }

  function resetFlow(){
    cStep = 0;
    flowSolved = false;
    renderFlow();
  }

  function renderFlow(){
    if(flowSolved){
      showCongratulations('المشكلة اتحلّت!');
      document.getElementById('flowStage').innerHTML = '<div style="text-align:center; padding:40px;"><h2 style="color:var(--sec)">برافو عليكي! 👏</h2><p style="margin-bottom:20px;">حليتي المشكلة بنفسك، ودي من أهم مهارات حل المشكلات.</p><button class="btn btn-yes" style="width:200px;" onclick="resetFlow()">إعادة المراجعة 🔄</button></div>';
      return;
    }

    if(cStep >= APP_DATA.checklist.length){
      document.getElementById('flowStage').innerHTML = '<div style="text-align:center; padding:40px;"><h2 style="color:var(--main)">لسه المشكلة موجودة؟ ولا يهمك 🐼</h2><p style="margin-bottom:12px;">إنتي راجعتي كل الخطوات الأساسية، فدلوقتي نادي الإنستراكتور يساعدك في الفحص المتقدم.</p><p style="margin-bottom:20px; color:#666;">ده مش معناه إنك عملتي حاجة غلط؛ بالعكس، إنتي دلوقتي تقدري تقولي له كل الخطوات اللي جرّبتيها.</p><button class="btn btn-no" style="width:220px;" onclick="resetFlow()">إعادة الخطوات من البداية 🔄</button></div>';
      return;
    }
    let s = APP_DATA.checklist[cStep];
    document.getElementById('flowStage').innerHTML = `
      <div class="step-card">
        <div class="step-num">${s.icon} خطوة ${cStep+1}</div>
        <h3>${s.title}</h3>
        <p style="white-space: pre-line;">${s.detail}</p>
        <p style="color:#888; font-size:0.9em; margin-top:10px;">💡 <b>تلميح:</b> ${s.tip}</p>
        <div class="btn-row">
          <button class="btn btn-yes" onclick="markFlowSolved()">✅ جربت واشتغلت</button>
          <button class="btn btn-no" onclick="cStep++;renderFlow()">➡️ لسه مش شغّالة</button>
        </div>
      </div>`;
  }
  renderFlow();

  const chatWindow = document.getElementById('chatWindow');

  function scrollChat(){ chatWindow.scrollTop = chatWindow.scrollHeight; }

  // باندا دايماً ظاهرة كشخصية، والتعبير بييجي من كلامها وحركتها
  function getPandaFace(){ return '🐼'; }

  function addBot(html, emotion, cb){
    let typing = document.createElement('div'); typing.className = 'msg bot typing';
    typing.innerHTML = `<div class="avatar">${getPandaFace()}</div><div class="bubble"><span></span><span></span><span></span></div>`;
    chatWindow.appendChild(typing); scrollChat();
    setTimeout(() => {
      typing.remove();
      let m = document.createElement('div'); m.className = 'msg bot';
      m.innerHTML = `<div class="avatar">${getPandaFace()}</div><div class="bubble">${html}</div>`;
      chatWindow.appendChild(m); scrollChat();
      if(cb) setTimeout(cb, 300);
    }, 750);
  }
  function addUser(text){
    let m = document.createElement('div'); m.className = 'msg user';
    m.innerHTML = `<div class="avatar" style="background:var(--yellow); border:none;">🙋‍♀️</div><div class="bubble">${text}</div>`;
    chatWindow.appendChild(m); scrollChat();
  }
  function addChoices(arr){
    let c = document.createElement('div'); c.className = 'choices';
    arr.forEach(it => {
      let b = document.createElement('button');
      b.className = 'chip' + (it.teal ? ' teal' : '');
      b.innerHTML = it.l;
      b.onclick = () => { c.remove(); addUser(it.l); setTimeout(it.act, 300); };
      c.appendChild(b);
    });
    chatWindow.appendChild(c); scrollChat();
  }

  function startChat(){
    chatWindow.innerHTML = ''; shieldType = null;
    addBot(APP_DATA.general.chatWelcome, '', () => {
      addChoices([
        { l: "🟦 شيلد الحساسات", act: () => setShield('sensor') },
        { l: "🟩 شيلد المواتير", act: () => setShield('motor') },
        { l: "🤔 أردوينو بس / مش متأكدة", act: () => setShield(null) }
      ]);
    });
  }

  function setShield(type){
    shieldType = type;
    let note = "";
    if(type === 'motor') note = "خدي بالك: على شيلد المواتير، أي مكون غير المواتير بيتوصل على بينات الـ S اللي هي أنالوج (A0–A5).<br>";
    else if(type === 'sensor') note = "تمام، شيلد الحساسات فيه صف بينات ديجيتال وصف أنالوج، وكل بين مكتوب جنبها حرف S.<br>";
    addBot(note + "قوليلي بقى إيه <b>المكون</b> اللي بيعمل مشكلة عشان نفحصه مع بعض؟", '', () => {
      let opts = APP_DATA.components.map(comp => ({ l: comp.icon + " " + comp.name, act: () => showIssues(comp) }));
      addChoices(opts);
    });
  }

  function showIssues(comp){
    addBot(`حلو جداً، إحنا هنفحص ونصلّح <b>${comp.name}</b> مع بعض.<br>إيه المشكلة اللي ظاهرة قدامك بالظبط؟`, '', () => {
      let opts = comp.issues.map((iss, idx) => ({ l: "⚠️ " + iss.q, teal: true, act: () => startProcess(comp.id, idx) }));
      opts.push({ l: "↩️ تغيير المكون", act: () => { addBot("اختاري المكون:", '', () => addChoices(APP_DATA.components.map(c => ({ l: c.icon + " " + c.name, act: () => showIssues(c) })))); }});
      addChoices(opts);
    });
  }

  function startProcess(compId, issueIdx){
    addBot("فهمت المشكلة! 💡 هنمشي خطوة بخطوة، وكل ما تخلّصي خطوة دوسي على الزرار. جاهزة؟", '', () => {
      processStep(compId, issueIdx, 0);
    });
  }

  function processStep(compId, issueIdx, stepIdx){
    let comp = APP_DATA.components.find(c => c.id === compId);
    let iss = comp.issues[issueIdx];
    if(stepIdx >= iss.steps.length){
      addBot("كده راجعنا كل حاجة، برمجياً وكهربياً 🐼<br>جرّبي دلوقتي.. لو اشتغلت يبقى عاش! ولو لسه، نادي الإنستراكتور وإنتي واثقة إن كودك وتوصيلك صح 100%.", '', () => {
        addChoices([
          { l: "✅ اشتغلت الحمدلله", act: () => { showCongratulations('اشتغلت بنجاح!'); addBot("يا بطلة! 👏✨ تصحيح الأخطاء من أهم مهارات البرمجة والإلكترونيات. فخورة بيكي جداً!", '', () => addChoices([{l:"🔄 فحص مكون تاني", act:startChat}])); } },
          { l: "🔄 فحص مكون تاني", act: startChat }
        ]);
      });
      return;
    }
    let st = iss.steps[stepIdx];
    let say = pandaLine(stepIdx);
    if(st.type === 'pinCheck'){
      addBot(`<span class="panda-say">${say}</span>${st.msg || "تعالي نتأكد من البينات:"}`, '', () => {
        renderPinForm(comp, st.role, () => showStepControls(compId, issueIdx, stepIdx, iss.steps.length));
      });
    } else {
      addBot(`<span class="panda-say">${say}</span><b>الخطوة ${stepIdx+1} من ${iss.steps.length}: ${st.n}</b><br>${st.t}`, '', () => {
        showStepControls(compId, issueIdx, stepIdx, iss.steps.length);
      });
    }
  }

  function showStepControls(compId, issueIdx, stepIdx, total){
    let opts = [];
    if(stepIdx + 1 < total) opts.push({ l: "✅ عملتها، إيه اللي بعده؟", teal: true, act: () => processStep(compId, issueIdx, stepIdx+1) });
    else opts.push({ l: "🏁 خلّصنا فحص المكون", teal: true, act: () => processStep(compId, issueIdx, stepIdx+1) });
    if(stepIdx > 0) opts.push({ l: "⬅️ أرجع للخطوة اللي فاتت", act: () => processStep(compId, issueIdx, stepIdx-1) });
    opts.push({ l: "🎉 اتحلّت المشكلة", act: () => { showCongratulations('اتحلّت المشكلة!'); addBot("يا بطلة! 👏✨ فخورة بيكي. حليتيها بنفسك!", '', () => addChoices([{l:"🔄 فحص مكون تاني", act:startChat}])); } });
    addChoices(opts);
  }

  // ===== فحص البينات =====
  function getPinOptions(){
    let h='<optgroup label="بينات ديجيتال">';
    for(let i=2;i<=13;i++) h+=`<option value="D${i}">Digital ${i}</option>`;
    h+='<option value="D0">Digital 0 (يُفضّل تجنّبها)</option><option value="D1">Digital 1 (يُفضّل تجنّبها)</option></optgroup>';
    h+='<optgroup label="بينات أنالوج">';
    for(let i=0;i<=5;i++) h+=`<option value="A${i}">Analog A${i}</option>`;
    h+='</optgroup>';
    return h;
  }

  function renderPinForm(comp, role, doneCb){
    let roleTxt = role ? `(سلك الـ ${role})` : '';
    let card = document.createElement('div'); card.className = 'msg bot';
    let id = Math.random().toString(36).substr(2,5);
    card.innerHTML = `
      <div class="avatar">${getPandaFace()}</div>
      <div class="pin-card">
        <h4>📍 فحص البينات ${roleTxt}</h4>
        <div class="field"><label>1) المكون متوصل على البوردة على بين رقم كام فعلياً؟</label><select id="real_${id}">${getPinOptions()}</select></div>
        <div class="field"><label>2) في الكود، إنتي كاتبة رقم كام؟</label><input type="number" id="code_${id}" placeholder="مثلاً: 9"></div>
        <button onclick="checkPinLogic('${comp.id}', '${comp.signal}', '${role}', '${id}', this)">🔍 افحصي</button>
      </div>`;
    chatWindow.appendChild(card); scrollChat();
    window._currentPinDoneCb = doneCb;
  }

  function checkPinLogic(compId, signal, role, id, btn){
    let real = document.getElementById('real_'+id).value;
    let codeRaw = document.getElementById('code_'+id).value;
    if(codeRaw === ''){ document.getElementById('code_'+id).style.borderColor='red'; return; }
    btn.disabled = true; document.getElementById('real_'+id).disabled=true; document.getElementById('code_'+id).disabled=true;
    let code = parseInt(codeRaw, 10);
    let type = real[0]; let idx = parseInt(real.slice(1), 10);
    addUser(`موصلة في ${real.replace('D','Digital ').replace('A','Analog A')} وكاتبة ${code}`);

    const A_MAP = {0:14, 1:15, 2:16, 3:17, 4:18, 5:19};
    let response = "تمام، نكمّل.";

    if(signal === 'analog'){
      if(type !== 'A') response = `🚫 المقاومة المتغيرة لازم تكون على بين أنالوج (A0–A5)، مش على ${real.replace('D','Digital ')}.. غيّري التوصيل وبعدين نكمّل.`;
      else if(code === idx) response = `✅ تمام جداً! المقاومة على A${idx} وكاتبة ${idx} في بلوك read analog pin (A).. مطابق وصح. 🎯`;
      else response = `⚠️ في عدم تطابق: المقاومة على A${idx}، فالمفروض تكتبي <b>${idx}</b> في بلوك read analog pin (A)، مش ${code}.`;
    } else if(signal === 'multi' && (role === 'Tx' || role === 'Rx')){
      if(code === idx) response = `❌ غلطة مشهورة! البلوتوث لازم تعكسي البينات. لو سلك الـ ${role} على ${idx} فعلياً، تكتبي ${idx} في الخانة <b>العكسية</b> في الكود. راجعي ده.`;
      else response = `✅ عظيم! طالما الرقم في الكود مش نفس التوصيلة الفعلية، يبقى إنتي عاكسة الأسلاك صح زي ما البلوتوث عايز.`;
    } else if(type === 'D'){
      if(idx === 0 || idx === 1) response = `⚠️ بين 0 و 1 بيعملوا مشاكل وقت رفع الكود. انقلي السلك لبين تانية لو تقدري.`;
      else if(code === idx) response = `✅ تطابق ممتاز! المكون على Digital ${idx} والكود مكتوب فيه ${code}. 🎯`;
      else response = `❌ في عدم تطابق! السلك على ${idx} بس إنتي كاتبة ${code}. غيّري الرقم في الكود لـ <b>${idx}</b>.`;
    } else if(type === 'A'){
      if(code === A_MAP[idx]) response = `✅ شطورة جداً! وصّلتي على Analog A${idx} وكتبتي ${A_MAP[idx]}.. دي حركة محترفة! 🎯`;
      else if(code === idx) response = `❌ عشان تستخدمي Analog A${idx} كـ ديجيتال، لازم تكتبي في الكود <b>${A_MAP[idx]}</b> مش ${idx}. صلّحيه.`;
      else response = `❌ عدم تطابق. إنتي على A${idx}، المفروض تكتبي في الكود <b>${A_MAP[idx]}</b>.`;
    }
    addBot(response, '', window._currentPinDoneCb);
  }
</script>
</body>
</html>
